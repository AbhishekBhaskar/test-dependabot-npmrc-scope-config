version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    registries:
      - jfrog-artifactory
      - jfrog-artifactory-2

  - package-ecosystem: "npm"
    directory: "/scope-replace-base"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    registries:
      - npmjs-base
      - jfrog-scoped

registries:
  jfrog-artifactory:
    type: "npm-registry"
    url: "https://jfrogghdemo.jfrog.io/artifactory/api/npm/dpndbt-pvt-repo-npm-key/"
    token: "${{secrets.JFROG_ARTIFACTORY_TOKEN}}"
    scope: "@mycompany"
    # replaces-base: true

  jfrog-artifactory-2:
    type: "npm-registry"
    url: "https://jfrogghdemo.jfrog.io/artifactory/api/npm/dpndbt-pvt-repo-npm-key/"
    token: "${{secrets.JFROG_ARTIFACTORY_TOKEN}}"
    scope: "@abhishekbhaskar"
    # replaces-base: true

  npmjs-base:
    type: "npm-registry"
    url: "https://registry.npmjs.org"
    token: "${{secrets.JFROG_ARTIFACTORY_TOKEN}}"
    replaces-base: true

  jfrog-scoped:
    type: "npm-registry"
    url: "https://jfrogghdemo.jfrog.io/artifactory/api/npm/dpndbt-pvt-repo-npm-key/"
    token: "${{secrets.JFROG_ARTIFACTORY_TOKEN}}"
    scope: "@mycompany"
    
